# Default values for cpp-ci.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nodeName: nod1

sshUser: op1

image:
  repository: cpp-ci
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "default"

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  privileged: true
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

hostAliases: []

service:
  ssh:
    type: NodePort
    port: 22
    nodePort: 32011

resources:
  limits:
    cpu: 1500m
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 128Mi

storage:
  mnt:
    size: 10Gi
    pathOnNode: /project_mapping
