apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ printf "%s-mnt" (include "cpp-ci.fullname" .) }}
  labels:
    {{- include "cpp-ci.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.storage.mnt.size }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain   
  storageClassName: ""
  local:
    path: {{ .Values.storage.mnt.pathOnNode }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ .Values.nodeName }}